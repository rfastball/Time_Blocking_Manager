[package]
name = "blokky"
version = "0.5.0"
edition = "2021"
license = "MIT"

[lib]
name = "blokky_core"
path = "src/lib.rs"

[[bin]]
name = "blokky"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-autostart", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
